<style>
/* Layout: brand header + stars, tabs (Lab / Missions); a sand-tank stage on top, controls and the P = F / A readout below. AD purple + aqua. */
:root{

}

  --sky1:#1b2236; --sky2:#232b42; --load:#8f7ad6; --base:#c6bfdc; --ok:#4fd08a; --no:#ff8a4c; --okbg:#173326; --nobg:#3a2316; color-scheme:dark}}
:root[data-theme="dark"]{
  --purple:#a796e6; --teal:#6fd3d1; --bg:#14111e; --paper:#1d1929; --fg:#ece8f7; --muted:#a9a2c2; --line:#332d47; --soft:#27223a;
  --sky1:#1b2236; --sky2:#232b42; --load:#8f7ad6; --base:#c6bfdc; --ok:#4fd08a; --no:#ff8a4c; --okbg:#173326; --nobg:#3a2316; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}

header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-bottom:14px;border-bottom:4px solid var(--purple);border-image:linear-gradient(90deg,var(--purple),var(--teal)) 1}

button:focus-visible,input:focus-visible{outline:3px solid var(--purple);outline-offset:2px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:8px 16px;font-weight:700}
.tab[aria-selected="true"]{background:var(--purple);border-color:var(--purple);color:#fff}

.fb .sol{font-family:var(--f-mono);font-size:14px;line-height:1.6;overflow-wrap:anywhere}

@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

.zone:disabled{opacity:.45;cursor:not-allowed}
.mapwrap{border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.mapwrap svg{display:block;width:100%;height:auto}

@media (prefers-reduced-motion:reduce){#xexplorer{transition:none}.hearts.hit,.bump{animation:none}}

.badge .bi{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--soft);color:var(--muted);flex:none}

<div class="wrap">
  <header>
    <img class="adlogo" src="__LOGO__" alt="Achievers Dream">
    <div><h1>Pressure Lab</h1><p class="lede">Pressure = force ÷ area &nbsp;<b>P = F / A</b> · Guide the explorer to safety!</p></div>
    <div class="stars" title="Stars from missions"><i aria-hidden="true">★</i><b id="stars">0</b><span id="maxstars" style="color:var(--muted);font-weight:400"></span></div>
  </header>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="t-exp" aria-selected="true">Expedition</button>
    <button class="tab" role="tab" id="t-lab" aria-selected="false">Lab</button>
    <button class="tab" role="tab" id="t-mis" aria-selected="false">Missions</button>
    <button class="tab" role="tab" id="t-qp" aria-selected="false">Quick Pick</button>
  </div>

  <!-- EXPEDITION -->
  <section class="card" id="exp">
    <div class="xhud">
      <div class="hearts" id="xhearts" aria-label="Hearts"></div>
      <div class="xcoins"><span class="coin" aria-hidden="true"></span><b id="xcoins">0</b></div>
      <div class="xcombo" id="xcombo"></div>
      <div class="xbtns"><button class="ghost sm" id="xshopbtn">Shop</button><button class="ghost sm" id="xbadgebtn">Badges</button><button class="ghost sm" id="xhowbtn">How to play</button></div>
    </div>
    <div class="zones" id="xzones"></div>
    <div class="mapwrap"><svg viewBox="0 0 640 210" id="xmap" aria-label="Expedition map"></svg></div>
    <div id="xchal" style="display:grid;gap:12px">
      <div class="row" style="justify-content:space-between"><h2 class="mtitle" id="xtitle"></h2><span class="xtag" id="xtag"></span></div>
      <p class="story" id="xstory"></p>
      <div class="timer" id="xtimer" hidden><div class="tbar"><i id="xtfill"></i></div><span id="xtsec"></span></div>
      <div class="stage"><svg viewBox="0 0 640 300" aria-label="Challenge scene"><g id="xground"></g><g id="xloadg"><g id="xload"></g></g><g id="xfront"></g></svg></div>
      <div id="xinput"></div>
      <div class="row"><button class="go" id="xcheck">Check</button><button class="ghost" id="xhint">Use hint scroll (<span id="xhints">0</span>)</button></div>
      <p class="hintbox" id="xhinttxt" hidden></p>
      <div class="fb" id="xfb" hidden></div>
      <div class="row"><button class="go" id="xnext" hidden>Continue</button></div>
    </div>
  </section>

  <div class="modal" id="xmodal" hidden><div class="mcard" role="dialog" aria-modal="true" aria-labelledby="xmt"><h2 id="xmt"></h2><div id="xmb"></div><button class="go" id="xmclose">Close</button></div></div>

  <!-- LAB -->
  <section class="card" id="lab" hidden>
    <div class="stage"><svg viewBox="0 0 640 300" id="labsvg" aria-label="A load pressing into sand">
      <g id="labground"></g>
      <g id="sinkg"><g id="labload"></g></g>
      <g id="labfront"></g>
    </svg></div>
    <div class="presets" id="presets"></div>
    <div class="ctrl"><label for="sF">Force (weight) <span id="vF"></span></label><input id="sF" type="range" min="10" max="2000" step="10" value="600"></div>
    <div class="ctrl"><label for="sA">Contact area <span id="vA"></span></label><input id="sA" type="range" min="1" max="100" step="1" value="40"></div>
    <div class="readout">
      <div class="rd"><small>Force</small><b id="rF"></b></div>
      <div class="rd"><small>Area</small><b id="rA"></b></div>
      <div class="rd p"><small>Pressure</small><b id="rP"></b></div>
    </div>
    <div class="formula" id="formula"></div>
    <p class="rule" id="rule"></p>
  </section>

  <!-- MISSIONS -->
  <section class="card" id="mis" hidden>
    <div class="levels" id="levels"></div>
    <h2 class="mtitle" id="mtitle"></h2>
    <p class="story" id="mstory"></p>
    <div class="stage"><svg viewBox="0 0 640 300" id="msvg" aria-label="Mission scene">
      <g id="mground"></g><g id="mloadg"><g id="mload"></g></g><g id="mfront"></g>
    </svg></div>
    <div id="minput"></div>
    <div class="row"><button class="go" id="check">Check</button><button class="ghost" id="hintbtn">Hint</button></div>
    <p class="hintbox" id="hint" hidden></p>
    <div class="fb" id="mfb" hidden></div>
    <div class="row"><button class="go" id="next" hidden>Next mission</button></div>
  </section>
  <!-- QUICK PICK -->
  <section class="card" id="qp" hidden>
    <div id="qpbody" style="display:grid;gap:14px">
      <div class="row" style="justify-content:space-between;font-family:var(--f-mono);font-size:14px;color:var(--muted)"><span id="qpnum"></span><span id="qpscore"></span></div>
      <div style="height:8px;background:var(--soft);border-radius:99px;overflow:hidden"><i id="qpbar" style="display:block;height:100%;width:0;background:var(--purple);transition:width .3s"></i></div>
      <h2 class="mtitle" id="qpq"></h2>
      <div class="stage"><svg viewBox="0 0 640 300" aria-label="Scene for the question"><g id="qground"></g><g id="qloadg"><g id="qload"></g></g><g id="qfront"></g></svg></div>
      <p class="rule">Tap an answer. No typing, just pick!</p>
      <div class="opts" id="qpopts"></div>
      <div class="fb" id="qpfb" hidden></div>
      <div class="row"><button class="go" id="qpnext" hidden>Next</button></div>
    </div>
    <div class="done" id="qpend" hidden><h2>Quick Pick done!</h2><div style="font-family:var(--f-display);font-size:52px;font-weight:700;color:var(--purple)" id="qpres"></div><p id="qpmsg" style="margin:0"></p><button class="go" id="qpagain">Play again</button></div>
  </section>
</div>

<script>
(function(){
const $=id=>document.getElementById(id),NS="http://www.w3.org/2000/svg";
const mk=(tag,a,p)=>{const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);p&&p.appendChild(e);return e};
const fmt=n=>{const a=Math.abs(n);const r=a>=100?Math.round(n):a>=1?Math.round(n*100)/100:Number(n.toPrecision(3));return r.toLocaleString("en-US",{maximumFractionDigits:8})};
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();

/* ---------- scene drawing ---------- */
const GY=210; // ground surface y
const MAT={sand:["--sand","--sand2","sand"],mud:["--mud","--mud2","mud"],snow:["--snow","--snow2","snow"]};
function ground(g,mat,dent,w){g.innerHTML="";const[c1,c2]=MAT[mat];
  const half=w/2,cx=320,d=dent;
  const path=`M0 ${GY} L${cx-half-26} ${GY} Q${cx-half-12} ${GY-d*.35} ${cx-half} ${GY+d} L${cx+half} ${GY+d} Q${cx+half+12} ${GY-d*.35} ${cx+half+26} ${GY} L640 ${GY} L640 300 L0 300 Z`;
  mk("path",{d:path,fill:`var(${c1})`},g);
  for(let i=0;i<26;i++){const x=(i*97)%640,y=GY+18+((i*53)%70);mk("circle",{cx:x,cy:y,r:2+(i%3),fill:`var(${c2})`,opacity:.7},g)}
  mk("text",{x:16,y:290,"font-size":14,"font-family":"var(--f-mono)",fill:`var(${c2})`},g).textContent=MAT[mat][2];
}
// a load: box of fixed size sitting on a base (contact) of width w
function load(g,w,label,kind){g.innerHTML="";const cx=320,bw=Math.max(6,w);
  const top=GY-130;
  if(kind==="person"){mk("circle",{cx,cy:top+14,r:16,fill:"var(--load)"},g);mk("rect",{x:cx-22,y:top+32,width:44,height:62,rx:14,fill:"var(--load)"},g);
    mk("rect",{x:cx-14,y:top+90,width:10,height:34,fill:"var(--load)"},g);mk("rect",{x:cx+4,y:top+90,width:10,height:34,fill:"var(--load)"},g)}
  else if(kind==="elephant"){mk("ellipse",{cx,cy:top+70,rx:70,ry:46,fill:"#8e8aa3"},g);mk("circle",{cx:cx+66,cy:top+48,r:28,fill:"#8e8aa3"},g);mk("path",{d:`M${cx+86} ${top+60} q14 30 4 56`,stroke:"#8e8aa3","stroke-width":12,fill:"none","stroke-linecap":"round"},g);
    for(const dx of[-46,-16,16,42])mk("rect",{x:cx+dx-9,y:top+100,width:18,height:26,fill:"#8e8aa3"},g)}
  else{mk("rect",{x:cx-60,y:top+20,width:120,height:GY-8-(top+20),rx:10,fill:"var(--load)"},g);
    mk("text",{x:cx,y:top+76,"text-anchor":"middle","font-size":20,"font-weight":700,fill:"#fff","font-family":"var(--f-body)"},g).textContent=label||""}
  // base (contact area)
  mk("rect",{x:cx-bw/2,y:GY-8,width:bw,height:8,rx:3,fill:"var(--base)"},g);
}
function arrows(g,w,density){g.innerHTML="";const n=Math.max(2,Math.min(14,Math.round(w/22)));const len=10+Math.min(40,density*40);
  for(let i=0;i<n;i++){const x=320-w/2+(i+.5)*w/n;mk("line",{x1:x,y1:GY+2,x2:x,y2:GY+4+len,stroke:"var(--teal)","stroke-width":3,"stroke-linecap":"round"},g);mk("path",{d:`M${x-5} ${GY+len-2} L${x} ${GY+6+len} L${x+5} ${GY+len-2}`,fill:"var(--teal)"},g)}}
// map pressure (Pa) to a dent depth in px. soft = max Pa the ground holds without sinking far.
function dentFor(P,soft){const r=P/soft;return r<=1?4+r*14:Math.min(70,18+Math.log2(r)*16)}

/* ---------- LAB ---------- */
const AREAS=[];for(let i=1;i<=100;i++){AREAS.push(Number(Math.pow(10,1+3*(i-1)/99).toPrecision(2)))} // 10 .. 10000 cm2 (log)
const PRE=[["Brick on its end",30,50],["You in sneakers",500,300],["You in high heels",500,20],["You on snowshoes",500,2000],["Elephant (4 feet)",50000,4000]];
let labKind="box",labLabel="LOAD";
const presets=$("presets");PRE.forEach(([n,F,A],i)=>{const b=document.createElement("button");b.className="chip";b.textContent=n;b.onclick=()=>{
  if(F>2000){$("sF").min=500;$("sF").max=60000;$("sF").step=500}else{$("sF").min=10;$("sF").max=2000;$("sF").step=10}
  $("sF").value=F;let k=0,best=1e9;AREAS.forEach((a,j)=>{const d=Math.abs(Math.log(a/A));if(d<best){best=d;k=j}});$("sA").value=k+1;
  labKind=i===4?"elephant":(i>=1&&i<=3?"person":"box");labLabel=i===0?"BRICK":"LOAD";
  [...presets.children].forEach(c=>c.setAttribute("aria-pressed",c===b));drawLab()};presets.appendChild(b)});
function drawLab(){const F=+$("sF").value,A=AREAS[+$("sA").value-1],Am=A/10000,P=F/Am;
  $("vF").textContent=fmt(F)+" N";$("vA").textContent=fmt(A)+" cm²";
  $("rF").textContent=fmt(F)+" N";$("rA").textContent=fmt(A)+" cm² = "+fmt(Am)+" m²";$("rP").textContent=fmt(P)+" Pa";
  $("formula").textContent="P = F ÷ A = "+fmt(F)+" N ÷ "+fmt(Am)+" m² = "+fmt(P)+" N/m² (Pa)   ·   "+fmt(F/A)+" N/cm²";
  const w=Math.max(8,Math.min(560,Math.sqrt(A)*5.5));const dent=dentFor(P,20000);
  ground($("labground"),"sand",dent,w);load($("labload"),w,labLabel,labKind);$("sinkg").style.transform=$("labfront").style.transform=`translateY(${dent}px)`;arrows($("labfront"),w,Math.min(1,Math.log10(P)/6));
  $("rule").textContent=P>20000?"The sand can't hold this much pressure. The load sinks in! Try a bigger area or a smaller force.":(P<5000?"Low pressure: the force is spread over a large area, so it hardly sinks.":"Medium pressure: it makes a small dent.");}
$("sF").oninput=()=>{[...presets.children].forEach(c=>c.setAttribute("aria-pressed","false"));drawLab()};$("sA").oninput=$("sF").oninput;

function check(){if(solved)return;const m=M[cur];let ok=false;
  if(m.type==="num"){const v=parseFloat(($("numin").value||"").replace(/[, ]/g,""));if(isNaN(v)){$("numin").focus();return}ok=Math.abs(v-m.ans)<=Math.abs(m.ans)*0.01+1e-9}
  else{if(picked<0){$("mfb").hidden=false;$("mfb").className="fb no";$("mfb").innerHTML="<b>Pick an option first.</b>";return}ok=picked===m.ans}
  tries++;const fb=$("mfb");fb.hidden=false;
  if(ok){solved=true;const st=tries===1?3:tries===2?2:1;best[cur]=Math.max(best[cur]||0,st);store.set("pl-best",JSON.stringify(best));paintStars();
    fb.className="fb ok";fb.innerHTML="<b></b><div class='sol'></div>";fb.firstChild.textContent="Correct! "+"★".repeat(st)+" ("+st+" star"+(st>1?"s":"")+")";fb.lastChild.textContent=m.sol;

let qpSet=[],qpI=0,qpScore=0,qpDone=false;
function qpAns(it){const P=it.o.map(([,F,A])=>F/A);if(it.rule==="max")return P.indexOf(Math.max(...P));if(it.rule==="min")return P.indexOf(Math.min(...P));return P.findIndex(p=>p<=it.rule)}
function qpStart(){const pool=QP.slice();for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}qpSet=pool.slice(0,8);qpI=0;qpScore=0;$("qpend").hidden=true;$("qpbody").hidden=false;qpShow()}
function qpDraw(it,k){const[,F,A]=it.o[k];const w=Math.max(6,Math.min(560,Math.sqrt(A*10000)*5.5));const P=F/A,dent=dentFor(P,it.soft);

    b.onmouseenter=()=>{if(!qpDone)qpDraw(it,k)};b.onfocus=b.onmouseenter;b.onclick=()=>qpPick(k);box.appendChild(b)})}

  [...$("qpopts").children].forEach((c,j)=>{c.disabled=true;c.lastChild.textContent=fmt(it.o[j][1]/it.o[j][2])+" Pa";if(j===a)c.classList.add("right");else if(j===k)c.classList.add("wrong")});

const RR=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),PK=a=>a[Math.floor(Math.random()*a.length)];
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const nice=x=>{const p=Math.pow(10,Math.floor(Math.log10(x))-1);return Math.round(x/p)*p};
// pick challenge: need = "below" (only one option stays under the limit) or "above" (only one beats the limit)
function pickC(o){const P=o.opts.map(([,A])=>o.F/A),s=P.slice().sort((a,b)=>a-b);let T,ans;
  if(o.need==="below"){T=nice(Math.sqrt(s[0]*s[1]));ans=P.indexOf(s[0])}else{T=nice(Math.sqrt(s[s.length-1]*s[s.length-2]));ans=P.indexOf(s[s.length-1])}
  const order=sh(o.opts.map((x,i)=>i));return {type:"pick",title:o.title,story:o.story.replace("{T}",fmt(T)),opts:order.map(i=>o.opts[i]),ans:order.indexOf(ans),F:o.F,T,need:o.need,
    scene:{mat:o.mat,soft:o.need==="below"?T:T*5,label:o.label,kind:o.kind},hint:o.hint,
    sol:order.map(i=>o.opts[i][0]+": "+fmt(o.F)+" ÷ "+fmt(o.opts[i][1])+" = "+fmt(P[i])+" Pa").join(" · ")+(o.need==="below"?" → only one is below "+fmt(T)+" Pa.":" → only one is above "+fmt(T)+" Pa.")}}

   ()=>pickC({title:"Ice fishing",story:"Make a hole in the ice. It only breaks above {T} Pa. Which tool do you push with 200 N?",need:"above",F:200,mat:"snow",kind:"box",label:"TOOL",opts:[["Ice pick (sharp point)",0.00005],["Shovel edge",0.002],["Snow boot",0.03]],hint:"Breaking needs a large pressure: smallest area."}),
   ()=>G.ncm("snow"),
   ()=>pickC({title:"Who can follow?",story:"Snow holds up to {T} Pa. Which team member can walk across without sinking?",need:"below",F:600,mat:"snow",kind:"person",opts:[["Explorer in boots",0.05],["Explorer on snowshoes",0.25],["Explorer in sneakers",0.03]],hint:"Find the smallest pressure."})]}
];
const BOSS=["Sand Crab King","Swamp Monster","Ice Giant"];
const BADGES=[["first","First steps","Clear your first stop"],["combo5","On fire","Get a 5× combo"],["flawless","Flawless","Clear a zone without losing a heart"],["z0","Beach champion","Beat the Sand Crab King"],["z1","Swamp champion","Beat the Swamp Monster"],["z2","Ice champion","Beat the Ice Giant"],["rich","Treasure hunter","Hold 300 coins"],["shop","Shopper","Buy something in the shop"]];
const OUTFITS=[["purple","Purple explorer",0,"#6b56a8"],["aqua","Aqua explorer",40,"#1f8f8f"],["gold","Golden explorer",80,"#e3a614"],["red","Red explorer",80,"#e2455a"]];
let X={zone:0,stop:0,hearts:3,maxH:3,coins:0,combo:0,hints:1,outfit:"purple",owned:["purple"],badges:[],unlocked:1,lost:false,best:{}};

function badge(id){if(X.badges.includes(id))return;X.badges.push(id);saveX();const b=BADGES.find(x=>x[0]===id);toast("Badge earned: "+b[1]+"!")}

function paintHUD(){$("xhearts").innerHTML="";for(let i=0;i<X.maxH;i++){const s=document.createElement("span");s.textContent="♥";if(i>=X.hearts)s.className="off";$("xhearts").appendChild(s)}
  $("xcoins").textContent=X.coins;$("xcombo").textContent=X.combo>1?"Combo ×"+Math.min(X.combo,5):"";$("xhints").textContent=X.hints;
  const z=$("xzones");z.innerHTML="";ZONES.forEach((Z,i)=>{const b=document.createElement("button");b.className="zone";b.textContent=(i+1)+". "+Z.name+(X.best[i]?" ✓":"");b.disabled=i>=X.unlocked;b.setAttribute("aria-pressed",i===X.zone);b.onclick=()=>{if(i!==X.zone){stopTimer();X.zone=i;X.stop=0;X.hearts=X.maxH;X.lost=false;X.combo=0;saveX();newStop()}};z.appendChild(b)})}
const NODE=[[70,150],[190,92],[320,140],[450,86],[570,128]];
function drawMap(){const Z=ZONES[X.zone],m=$("xmap");m.innerHTML="";

  NODE.forEach(([x,y],i)=>{const boss=i===4,done=i<X.stop;const g=mk("g",{},m);
    mk("circle",{cx:x,cy:y,r:boss?24:18,fill:done?"var(--teal)":i===X.stop?"#fff":"var(--paper)",stroke:boss?"#e2455a":"var(--purple)","stroke-width":4},g);
    const t=mk("text",{x,y:y+6,"text-anchor":"middle","font-size":boss?13:16,"font-weight":700,fill:done?"#fff":"var(--fg)","font-family":"var(--f-body)"},g);t.textContent=done?"✓":boss?"BOSS":String(i+1)});

  const [x,y]=NODE[Math.min(X.stop,4)];e.style.transform=`translate(${x}px,${y-16}px)`}
function moveExplorer(){const [x,y]=NODE[Math.min(X.stop,4)];const e=$("xexplorer");if(e)e.style.transform=`translate(${x}px,${y-16}px)`}
function xScene(F,A,mat,soft,label,kind){const w=Math.max(6,Math.min(560,Math.sqrt(A*10000)*5.5)),P=F/A,dent=dentFor(P,soft);
  ground($("xground"),mat,dent,w);load($("xload"),w,label,kind);$("xloadg").style.transform=$("xfront").style.transform=`translateY(${dent}px)`;arrows($("xfront"),w,Math.min(1,Math.log10(P)/7))}
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null}$("xtimer").hidden=true}
function newStop(){stopTimer();xSolved=false;xPicked=-1;xTries=0;const Z=ZONES[X.zone];
  if(X.stop>=4){bossN=bossN||0;const gens=[G.calcP,G.calcF,G.calcA,G.conv,G.ncm];C=PK(gens)(Z.mat);C.title=BOSS[X.zone]+": round "+(bossN+1)+" of 3";C.boss=true}
  else{C=Z.stops[X.stop]();bossN=0}
  $("xtitle").textContent=C.title;$("xstory").textContent=C.story;const tg=$("xtag");tg.textContent=C.boss?"Boss battle":"Stop "+(X.stop+1);tg.className="xtag"+(C.boss?" boss":"");
  $("xfb").hidden=true;$("xnext").hidden=true;$("xcheck").hidden=false;$("xhint").hidden=false;$("xhinttxt").hidden=true;$("xhinttxt").textContent="Hint: "+C.hint;
  const box=$("xinput");box.innerHTML="";

    box.innerHTML='<div class="ans"><label for="xnum" style="font-weight:700">Answer</label><input id="xnum" inputmode="decimal" autocomplete="off"><span style="font-family:var(--f-mono)">'+C.unit+'</span></div>';$("xnum").addEventListener("keydown",e=>{if(e.key==="Enter")xCheck()})}
  else{const s=C.scene;xScene(C.F,C.opts[0][1],s.mat,s.soft,s.label,s.kind);const d=document.createElement("div");d.className="opts";
    C.opts.forEach(([n,A],k)=>{const b=document.createElement("button");b.className="opt";b.innerHTML="<span></span><span>preview</span>";b.firstChild.textContent=n;
      b.onclick=()=>{if(xSolved)return;xPicked=k;[...d.children].forEach(c=>c.setAttribute("aria-pressed",c===b));xScene(C.F,A,s.mat,s.soft,s.label,s.kind)};d.appendChild(b)});box.appendChild(d)}
  if(C.boss){tLeft=40;$("xtimer").hidden=false;const tick=()=>{$("xtfill").style.width=(tLeft/40*100)+"%";$("xtsec").textContent=tLeft+"s";if(tLeft<=0){stopTimer();loseHeart("Time's up!");return}tLeft--};tick();timerId=setInterval(tick,1000)}
  paintHUD();drawMap()}
function loseHeart(msg){X.hearts--;X.combo=0;X.lost=true;const h=$("xhearts");h.classList.remove("hit");void h.offsetWidth;h.classList.add("hit");saveX();
  const fb=$("xfb");fb.hidden=false;fb.className="fb no";fb.innerHTML="<b></b>";fb.firstChild.textContent=msg+" You lost a heart.";
  if(xTries>=2&&C.sol){const s=document.createElement("div");s.className="sol";s.textContent="How to solve it: "+C.sol;fb.appendChild(s)}
  if(X.hearts<=0){stopTimer();$("xcheck").hidden=true;$("xhint").hidden=true;const n=$("xnext");n.hidden=false;n.textContent="Out of hearts! Restart zone";n.onclick=()=>{X.stop=0;X.hearts=X.maxH;X.lost=false;bossN=0;saveX();n.onclick=xContinue;newStop()}}
  else if(C.boss&&!timerId){tLeft=40;$("xtimer").hidden=false;timerId=setInterval(()=>{$("xtfill").style.width=(tLeft/40*100)+"%";$("xtsec").textContent=tLeft+"s";if(tLeft<=0){stopTimer();loseHeart("Time's up!");return}tLeft--},1000)}
  paintHUD()}
function xCheck(){if(xSolved||X.hearts<=0)return;let ok;
  if(C.type==="num"){const v=parseFloat(($("xnum").value||"").replace(/[, ]/g,""));if(isNaN(v)){$("xnum").focus();return}ok=Math.abs(v-C.ans)<=Math.abs(C.ans)*0.01+1e-9}
  else{if(xPicked<0){const fb=$("xfb");fb.hidden=false;fb.className="fb no";fb.innerHTML="<b>Pick an option first.</b>";return}ok=xPicked===C.ans}
  xTries++;
  if(!ok){if(C.type==="pick"){const c=$("xinput").querySelector(".opts").children[xPicked];c.lastChild.textContent=fmt(C.F/C.opts[xPicked][1])+" Pa";c.classList.add("wrong");

    loseHeart(C.type==="pick"?(C.need==="below"?"Splosh! It sank.":"Not enough pressure!"):"Not quite.");return}
  xSolved=true;stopTimer();X.combo++;const mult=Math.min(X.combo,5),gain=(C.boss?20:10)*mult;X.coins+=gain;const cb=$("xcoins").parentElement;cb.classList.remove("bump");void cb.offsetWidth;cb.classList.add("bump");
  const fb=$("xfb");fb.hidden=false;fb.className="fb ok";fb.innerHTML="<b></b><div class='sol'></div>";fb.firstChild.textContent="Correct! +"+gain+" coins"+(mult>1?" (combo ×"+mult+")":"");fb.lastChild.textContent=C.sol;
  if(C.type==="pick"){[...$("xinput").querySelector(".opts").children].forEach((c,k)=>{c.lastChild.textContent=fmt(C.F/C.opts[k][1])+" Pa";if(k===C.ans)c.classList.add("right")});xScene(C.F,C.opts[C.ans][1],C.scene.mat,C.scene.soft,C.scene.label,C.scene.kind)}
  badge("first");if(X.combo>=5)badge("combo5");if(X.coins>=300)badge("rich");
  $("xcheck").hidden=true;$("xhint").hidden=true;const n=$("xnext");n.hidden=false;n.onclick=xContinue;
  if(C.boss&&bossN<2){n.textContent="Next boss round";}else if(C.boss){n.textContent="Claim victory!"}else n.textContent="Continue";
  paintHUD();saveX()}
function xContinue(){if(C.boss){if(bossN<2){bossN++;newStop();return}
    // zone clear
    X.best[X.zone]=1;badge("z"+X.zone);if(!X.lost)badge("flawless");X.coins+=50;if(X.unlocked<3&&X.unlocked===X.zone+1)X.unlocked++;bossN=0;
    openModal("Zone cleared!","<p style='margin:0'>You beat the "+BOSS[X.zone]+"! +50 bonus coins."+(X.zone<2?" The next zone is now unlocked.":" You are a Pressure Pro!")+"</p>");
    if(X.zone<2){X.zone++;}X.stop=0;X.hearts=X.maxH;X.lost=false;saveX();newStop();return}

$("xcheck").onclick=xCheck;
$("xhint").onclick=()=>{if(X.hints<=0){$("xhinttxt").hidden=false;$("xhinttxt").textContent="No hint scrolls left. Buy more in the Shop.";return}X.hints--;saveX();paintHUD();$("xhinttxt").hidden=false;$("xhinttxt").textContent="Hint: "+C.hint;$("xhint").hidden=true};

  let h="<p style='margin:0'>You have <b>"+X.coins+"</b> coins.</p>";items.forEach(([id,n,d,c])=>{const own=id.startsWith("o-")&&X.owned.includes(id.slice(2));const wear=id.startsWith("o-")&&X.outfit===id.slice(2);
